gedbrowser:
  home: /var/lib/gedbrowser

logging:
  level:
    io:
      micronaut:
        http:
          server: INFO
    org:
      schoellerfamily: INFO

geoservice:
  clear: false
  keyfile: /var/lib/gedbrowser/google-geocoding-key
  backupfile: /var/lib/gedbrowser/geoservice-backup.json

micronaut:
  server:
    port: 8082
    netty:
      access-logger:
        enabled: true
  security:
    enabled: true
    intercept-url-map:
      - pattern: /actuator/**
        http-method: GET
        access:
          - isAnonymous()
      - pattern: /geocode
        http-method: GET
        access:
          - isAnonymous()
      - pattern: /geocode
        http-method: POST
        access:
          - isAnonymous()
      - pattern: /geocode
        http-method: PUT
        access:
          - isAnonymous()
      - pattern: /geocode
        http-method: DELETE
        access:
          - isAnonymous()

# All management-style endpoints are served as regular Micronaut HTTP controllers
# under /actuator in this module.
