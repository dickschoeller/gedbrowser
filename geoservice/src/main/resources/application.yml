gedbrowser:
  home: /var/lib/gedbrowser

logging:
  level:
    io:
      micronaut:
        http:
          server: INFO
    org:
      schoellerfamily: INFO

geoservice:
  keyfile: /var/lib/gedbrowser/google-geocoding-key
  geocoder: google
  backupfile: /var/lib/gedbrowser/geoservice-backup.json

micronaut:
  server:
    port: 8082
    netty:
      access-logger:
        enabled: true

# All management-style endpoints are served as regular Micronaut HTTP controllers
# under /actuator in this module.
